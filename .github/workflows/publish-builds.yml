name: Publish release

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Bilingual update notes (JSON array with id, zh and en; optional)'
        type: string
        required: false
        default: '[]'

permissions:
  contents: read

# A version has one official release; do not publish competing runs concurrently.
concurrency:
  group: nexbox-official-release
  cancel-in-progress: false

jobs:
  build:
    name: Build Release for both ARM ABIs
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      version: ${{ steps.bundle.outputs.version }}
      artifact_name: ${{ steps.bundle.outputs.artifact_name }}
      build_attempt: ${{ steps.bundle.outputs.build_attempt }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check release version and update notes
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          NEXBOX_RELEASE_NOTES: ${{ inputs.release_notes }}
        run: python3 .github/scripts/release_bundle.py prepare

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Retain GitHub-hosted caching instead of the new commercial default.
          cache-provider: basic
          dependency-graph: disabled
          build-scan-publish: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install pinned Android toolchains
        run: |
          sdkmanager \
            'platforms;android-37.0' \
            'build-tools;35.0.0' \
            'ndk;29.0.14206865' \
            'cmake;3.31.6'

      - name: Build all three Release APKs with the pinned NexBox signing key
        env:
          NEXBOX_KEYSTORE_BASE64: ${{ secrets.NEXBOX_KEYSTORE_BASE64 }}
          NEXBOX_KEYSTORE_PASSWORD: ${{ secrets.NEXBOX_KEYSTORE_PASSWORD }}
          NEXBOX_KEY_ALIAS: ${{ secrets.NEXBOX_KEY_ALIAS }}
          NEXBOX_KEY_PASSWORD: ${{ secrets.NEXBOX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for variable in NEXBOX_KEYSTORE_BASE64 NEXBOX_KEYSTORE_PASSWORD NEXBOX_KEY_ALIAS NEXBOX_KEY_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              printf '::error::Missing signing secret: %s\n' "$variable"
              exit 1
            fi
          done
          NEXBOX_KEYSTORE_PATH="$(mktemp "$RUNNER_TEMP/nexbox-signing.XXXXXX.p12")"
          export NEXBOX_KEYSTORE_PATH
          trap 'rm -f -- "$NEXBOX_KEYSTORE_PATH"' EXIT
          printf 'NEXBOX_TEMP_KEYSTORE_PATH=%s\n' "$NEXBOX_KEYSTORE_PATH" >> "$GITHUB_ENV"
          printf '%s' "$NEXBOX_KEYSTORE_BASE64" | base64 --decode > "$NEXBOX_KEYSTORE_PATH"
          unset NEXBOX_KEYSTORE_BASE64
          if [[ ! -s "$NEXBOX_KEYSTORE_PATH" ]]; then
            echo '::error::The signing keystore is empty.'
            exit 1
          fi
          # Signing credentials must not be serialized into Gradle's configuration cache.
          bash ./gradlew --no-daemon --no-configuration-cache --stacktrace --console=plain --max-workers=2 \
            --warning-mode all --rerun-tasks --no-build-cache -Pkotlin.incremental=false \
            --init-script .github/scripts/build-diagnostics.init.gradle \
            -PnexboxAbis=armeabi-v7a,arm64-v8a \
            :app:assembleRelease

      - name: Remove the temporary signing-key file
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [[ -n "${NEXBOX_TEMP_KEYSTORE_PATH:-}" ]]; then
            rm -f -- "$NEXBOX_TEMP_KEYSTORE_PATH"
          fi

      - name: Verify APK signatures against the pinned signing certificate
        id: signing
        run: |
          set -euo pipefail
          mapfile -t certificate_pins < gradle/signing-certificate.sha256
          if (( ${#certificate_pins[@]} != 1 )) || [[ ! "${certificate_pins[0]}" =~ ^[0-9a-f]{64}$ ]]; then
            echo '::error::Expected one lowercase SHA-256 signing certificate pin.'
            exit 1
          fi
          certificate="${certificate_pins[0]}"
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if (( ${#apks[@]} != 3 )); then
            echo '::error::Expected exactly three Release APKs (arm64-v8a, armeabi-v7a and universal).'
            exit 1
          fi
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" |
              tee "$RUNNER_TEMP/nexbox-apk-signature.txt"
            mapfile -t digests < <(sed -n -E 's/^Signer #[0-9]+ certificate SHA-256 digest: //p' "$RUNNER_TEMP/nexbox-apk-signature.txt")
            if (( ${#digests[@]} != 1 )) || [[ "${digests[0]}" != "$certificate" ]]; then
              echo '::error::Each APK must have exactly the pinned NexBox signing certificate.'
              exit 1
            fi
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" |
              sed -n -E '/^(package|sdkVersion|targetSdkVersion|native-code):/p'
          done
          printf 'certificate=%s\n' "$certificate" >> "$GITHUB_OUTPUT"

      - name: Validate and collect APKs with private build metadata
        id: bundle
        env:
          SIGNING_CERT_SHA256: ${{ steps.signing.outputs.certificate }}
          NEXBOX_VERSION: ${{ steps.prepare.outputs.version }}
          NEXBOX_RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          python3 .github/scripts/release_bundle.py collect \
            --apk-root app/build/outputs/apk --output-dir build/ci-release \
            --mapping app/build/outputs/mapping/release/mapping.txt
          {
            printf '### NexBox Release\n\n'
            printf 'Three Release APKs: arm64-v8a, armeabi-v7a and universal. No Debug APKs are built or published.\n\n'
            printf 'APK signatures, architectures, versions and bundle checksums are checked before publication.\n\n'
            printf 'Tests: `not-run`. An official release is not a claim of device validation.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain APKs, mapping and metadata for publication retries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bundle.outputs.artifact_name }}
          path: build/ci-release/
          archive: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish official release
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      NEXBOX_VERSION: ${{ needs.build.outputs.version }}
      NEXBOX_BUILD_ATTEMPT: ${{ needs.build.outputs.build_attempt }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact commit and release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the complete bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-artifacts
          skip-decompress: false
          digest-mismatch: error

      - name: Verify the bundle and publish the official release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release_bundle.py publish --bundle-dir release-artifacts

      - name: Report the published release
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          {
            printf '### Official release published\n\n'
            printf '[%s](%s)\n\n' "$RELEASE_TAG" "$RELEASE_URL"
            printf 'Only three Release APKs are attached. Update notes and APK SHA-256 checksums are in the release body.\n\n'
            printf 'Mapping and build metadata remain in the 7-day Actions artifact for diagnostics and publication retries.\n'
          } >> "$GITHUB_STEP_SUMMARY"

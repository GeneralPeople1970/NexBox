@DisableCachingByDefault(because = 'Relocates signed APKs and their AGP artifact metadata')
abstract class RenameNexBoxApks extends DefaultTask {
    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getInputDirectory()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @Input
    abstract Property<String> getBuildTypeName()

    @Internal
    abstract Property<ArtifactTransformationRequest<RenameNexBoxApks>> getTransformationRequest()

    @TaskAction
    void renameApks() {
        def destination = outputDirectory.get().asFile
        Files.createDirectories(destination.toPath())
        def outputNames = new HashSet<String>()
        transformationRequest.get().submit(this, { BuiltArtifact artifact ->
            if (artifact.versionName == null || artifact.versionName.isEmpty()) {
                throw new GradleException('Cannot name a NexBox APK without version metadata')
            }
            def abi = artifact.filters.find {
                it.filterType == FilterConfiguration.FilterType.ABI
            }?.identifier ?: 'universal'
            String name = "NexBox-${artifact.versionName}-${abi}-${buildTypeName.get()}.apk"
            if (!outputNames.add(name)) {
                throw new GradleException("Duplicate NexBox APK output name: ${name}")
            }
            def output = new File(destination, name)
            Files.copy(new File(artifact.outputFile).toPath(), output.toPath(),
                    StandardCopyOption.REPLACE_EXISTING)
            // AGP retains each split's filters/version and writes metadata for this returned file.
            output
        })
    }
}

class CopyNexBoxApks implements Action<Task>, Serializable {
    private final Provider<Directory> apkDirectory
    private final BuiltArtifactsLoader artifactsLoader
    private final File deliveryDirectory

    CopyNexBoxApks(Provider<Directory> apkDirectory, BuiltArtifactsLoader artifactsLoader,
                  File deliveryDirectory) {
        this.apkDirectory = apkDirectory
        this.artifactsLoader = artifactsLoader
        this.deliveryDirectory = deliveryDirectory
    }

    @Override
    void execute(Task task) {
        def artifacts = artifactsLoader.load(apkDirectory.get())
        if (artifacts == null || artifacts.elements.isEmpty()) {
            throw new GradleException('Cannot copy NexBox APKs: artifact metadata is missing or empty')
        }
        Files.createDirectories(deliveryDirectory.toPath())
        artifacts.elements.each { artifact ->
            def source = new File(artifact.outputFile)
            Files.copy(source.toPath(), new File(deliveryDirectory, source.name).toPath(),
                    StandardCopyOption.REPLACE_EXISTING)
        }
    }
}
